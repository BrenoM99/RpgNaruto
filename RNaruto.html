<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas do RPG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap');
:root{--paper1:#fff3d6;--paper2:#f9c690;--brown:#5b3420;--brown2:#7a4a2c;--cream:#fbe6bb;--ink:#3a2012;--field:#fffaf0;--gold:#e9b95c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper1:#fff3d6;--paper2:#f9c690}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,var(--paper1),var(--paper2));background-attachment:fixed;color:var(--ink);font-family:'Patrick Hand','Segoe UI',sans-serif;font-size:17px}
h1,h2,h3,.brush{font-family:'Caveat Brush','Comic Sans MS',cursive;font-weight:400;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.frame{border:4px solid var(--brown);border-radius:6px;padding:10px;background:rgba(255,248,230,.55);outline:2px solid var(--brown);outline-offset:-10px}
/* menu */
.menu h1{font-size:44px;text-align:center;color:var(--brown);margin:18px 0 4px}
.menu p{text-align:center;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{all:unset;cursor:pointer;background:var(--brown);color:var(--cream);border-radius:6px;padding:22px 10px;text-align:center;border:3px solid var(--gold);font-family:'Caveat Brush',cursive;font-size:30px}
.card small{display:block;font-family:'Patrick Hand',sans-serif;font-size:15px;opacity:.85;margin-top:4px}
.card:hover,.card:focus-visible{background:var(--brown2);outline:3px solid var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{cursor:pointer;background:var(--brown);color:var(--cream);border:0;border-radius:4px;padding:8px 14px;font:inherit}
.btn:focus-visible{outline:3px solid var(--ink)}
.saved{margin-left:auto;font-size:15px;color:var(--brown2)}
/* header */
.head{background:linear-gradient(100deg,var(--brown) 70%,var(--brown2));border-radius:4px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px}
.head label,.lbl{font-family:'Caveat Brush',cursive;color:var(--cream);font-size:20px;display:block}
input,textarea,select{font:inherit;color:var(--ink);background:var(--field);border:2px solid var(--brown);border-radius:3px;padding:4px 6px;width:100%}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
textarea{resize:vertical;min-height:110px;line-height:1.35}
.num{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.head{grid-template-columns:1fr 1fr}}
.panel{background:var(--brown);border-radius:4px;overflow:hidden}
.panel>h2{color:var(--cream);text-align:center;font-size:32px;padding:4px}
.panel>.body{background:rgba(255,246,222,.92);padding:8px}
/* atributos */
.attrs{position:relative;height:330px;max-width:330px;margin:0 auto}
.hex{position:absolute;inset:50px 40px;background:var(--brown2);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);display:grid;place-items:center;color:var(--gold);font-family:'Caveat Brush';font-size:34px}
.at{position:absolute;width:78px;height:78px;border:5px solid var(--brown);border-radius:50%;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center}
.at input{border:0;background:transparent;font-size:28px;width:60px;text-align:center;padding:0}
.at span{font-family:'Caveat Brush';color:var(--brown);margin-top:-6px}
.at.FOR{top:0;left:126px}.at.CON{top:55px;right:0}.at.PRE{top:195px;right:0}.at.ESP{bottom:0;left:126px}.at.MEN{top:195px;left:0}.at.DES{top:55px;left:0}
/* vitais */
.vit{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-top:10px;align-items:start}
.mini{background:var(--brown);border-radius:4px;color:var(--cream);text-align:center;padding:4px;font-family:'Caveat Brush';margin-bottom:8px}
.mini input{margin-top:2px;font-size:22px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair div{background:var(--field);border:2px solid var(--brown);color:var(--ink);padding:4px;border-radius:3px;font-family:'Patrick Hand';font-size:14px}
.pair input{border:0;font-size:24px;text-align:center}
.vh{background:var(--brown);color:var(--cream);font-family:'Caveat Brush';text-align:center;padding:2px;margin-top:6px}
/* pericias */
.per{display:grid;grid-template-columns:22px 1fr 44px 14px 54px 14px 48px;gap:4px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(91,52,32,.25)}
.per .n{font-family:'Caveat Brush';font-size:20px;color:var(--brown);line-height:1}
.per input[type=number]{padding:2px;text-align:center}
.per output{text-align:center;font-weight:bold;font-size:20px}
.per input[type=checkbox]{width:18px;height:18px;accent-color:var(--brown)}
/* ataques */
.atk{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:4px;margin-bottom:4px}
.atk.h{font-size:14px;color:var(--brown2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.full{margin-top:12px}
.hidden{display:none}
.bk textarea{min-height:70px;font-size:13px}

.card{display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left}
.av{height:110px;image-rendering:pixelated;flex:none}
.sav{height:72px;image-rendering:pixelated}
.lh{display:flex;justify-content:flex-end;margin-bottom:8px}
.nb{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.it{background:var(--brown);border-radius:6px;margin-bottom:8px;overflow:hidden}
.ith{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;color:var(--cream);font-family:'Caveat Brush',cursive;font-size:22px}
.ith:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.chev{color:var(--gold)}
.ib{background:var(--field);padding:10px;border-top:3px solid var(--gold)}
.bd{white-space:pre-wrap;line-height:1.4}
.ft{display:flex;justify-content:space-between;margin-top:10px}
.lk{background:none;border:0;font:inherit;cursor:pointer;padding:4px 2px}
.rm{color:#a3281f}.ok{color:#2f6b2f}
.eb{margin-top:6px;min-height:90px}
.empty{margin:4px 0;color:var(--brown2)}
.pal{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:var(--brown);color:var(--cream);padding:8px 12px;border-radius:6px;cursor:pointer}
.pal input{width:20px;height:20px;accent-color:var(--gold)}
.mini output{display:block;font-size:28px;color:var(--cream);line-height:1.1}
.mini small{display:block;font-family:'Patrick Hand';font-size:14px}
.mini select{font-size:14px;padding:2px;margin-top:2px}
.pair output{display:block;text-align:center;font-size:26px}
.per{grid-template-columns:22px 1fr 34px 10px 34px 10px 50px 10px 40px!important;gap:3px!important}
.per .n{font-size:16px!important}
.per input[type=number]{font-size:15px}
.ph{font-size:12px;color:var(--brown2);text-align:center;border:0}
.vit{grid-template-columns:110px 1fr!important}
select{cursor:pointer}
.pal{display:inline-flex;padding:4px 12px;font-size:15px;margin-bottom:6px}
.per .rl{all:unset;cursor:pointer;font-family:'Caveat Brush',cursive;font-size:16px;color:var(--brown);line-height:1}
.rl:hover{text-decoration:underline}.rl:focus-visible{outline:3px solid var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brown);color:var(--cream);padding:10px 16px;border-radius:6px;border:2px solid var(--gold);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.chat{margin-top:18px}
.cr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.cr select{width:auto}.cr input{flex:1;min-width:90px}
.ri{border-bottom:1px solid rgba(91,52,32,.25);padding:6px 0}
.ri small{display:block;color:var(--brown2);font-size:14px}
.err{color:#a3281f;min-height:1.2em;margin:0}

.spread{display:block}.pg{min-width:0}
.lh{gap:8px;flex-wrap:wrap}
@media(min-width:1000px){.wrap:has(#sheet:not(.hidden)){max-width:1560px}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.pg{background:rgba(255,248,230,.55);border:2px solid var(--brown);border-radius:4px;padding:10px}
.pg>.panel.full:first-child{margin-top:0}}
.dr{display:flex;flex-wrap:wrap;gap:10px}
.dd{display:flex;flex-direction:column;align-items:center}
.dsel{all:unset;cursor:pointer;position:relative;width:72px;text-align:center}
.dsel svg{width:72px;height:72px}.dsel:focus-visible{outline:3px solid var(--gold)}
.dsel:active svg{transform:scale(.92)}
.dn{display:block;font-family:'Caveat Brush',cursive;color:var(--brown)}
.db{position:absolute;top:-4px;right:-4px;background:var(--brown);color:var(--cream);border-radius:50%;min-width:24px;height:24px;display:grid;place-items:center;font-size:14px}
.pk{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.pk.hidden{display:none}
.pkb{background:var(--paper1);width:min(720px,100%);max-height:85vh;overflow:auto;border-radius:10px 10px 0 0;padding:12px;border:3px solid var(--brown)}
.pkh{position:sticky;top:-12px;background:var(--paper1);padding-bottom:6px}
.pkb h3{color:var(--brown);margin:10px 0 4px;font-size:22px}
.pe{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;padding:8px;border-bottom:1px solid rgba(91,52,32,.25)}
.pe:hover,.pe:focus-visible{background:var(--field)}.pe small{display:block;color:var(--brown2)}
.vb{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.vbtn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:var(--brown);color:var(--cream);display:grid;place-items:center;font-size:22px;flex:none;user-select:none}
.vbtn:focus-visible{outline:3px solid var(--gold)}.vbtn:active{transform:scale(.9)}
.bar2{position:relative;flex:1;height:30px;border-radius:15px;overflow:hidden;border:2px solid var(--brown);background:rgba(0,0,0,.2)}
.bar2 .fill{position:absolute;inset:0 auto 0 0;width:0;transition:width .2s}
.bar2.pv .fill{background:linear-gradient(#ef5350,#b71c1c)}
.bar2.pc .fill{background:linear-gradient(#42a5f5,#1565c0)}
.bar2 span{position:relative;display:block;text-align:center;line-height:26px;color:#fff;font-weight:bold;text-shadow:0 1px 2px #000}
.stp{display:flex;align-items:center;justify-content:center;gap:6px}
.stp output{font-size:24px!important;min-width:46px}
.panel>h2.hj{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:4px 12px;text-align:left}
.cds{font-family:'Caveat Brush',cursive;font-size:20px;color:var(--cream);letter-spacing:.3px}.cds output{font-size:26px;color:var(--gold)}
.vh small{font-family:'Patrick Hand',sans-serif;font-size:14px}
.bar2.sb .fill{background:linear-gradient(#66bb6a,#2e7d32)}
.bar2.bk .fill{background:linear-gradient(#ffb74d,#e65100)}
.tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-family:'Patrick Hand',sans-serif;font-size:14px;background:var(--cream);color:var(--brown);padding:0 8px;border-radius:10px;white-space:nowrap}
.tg.ok{background:#2e7d32;color:#fff}.tg.no{opacity:.75}
.wr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--field);border-top:3px solid var(--gold)}
.wb{display:inline-flex!important;align-items:center;gap:4px;border:2px solid var(--brown)!important;border-radius:4px;padding:2px 8px!important;color:var(--brown)}
.wb svg{width:26px;height:26px}.wr small{color:var(--brown2);margin-left:auto}
.ib .wr{background:none;border-top:0;padding:0 0 8px}
.mmb{color:var(--gold)!important}
body.curse{background:radial-gradient(circle at 50% 0,var(--paper1),var(--paper2) 75%) fixed}
.curse .frame,.curse .pg{background:var(--frame);box-shadow:0 0 28px var(--glow)}
.curse .panel>.body,.curse .ib,.curse .wr,.curse .pkb,.curse .pkh{background:var(--panel)}
.curse .per .n,.curse .per .rl,.curse .dn,.curse .nb,.curse .wb,.curse .ph,.curse .empty,.curse .wr small,.curse .at span,.curse .pkb h3,.curse .lbl,.curse .saved{color:var(--acc)!important}
.curse .nb,.curse .wb{border-color:var(--bd)!important}
.curse .dsel text{fill:var(--acc)}.curse .rm{color:var(--acc)}.curse .ok{color:#7fd48a}
.curse .at{box-shadow:0 0 10px var(--glow)}
.tg.on{background:#7b3fc4;color:#fff}
.card .plus{font-size:44px;width:80px;text-align:center;color:var(--gold);flex:none}
.pal+.pal{margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <div id="menu" class="menu">
    <h1>Fichas do RPG</h1>
    <p>Escolha seu personagem</p>
    <div class="cards" id="cards"></div>
    <div class="panel chat"><h2>Chat de dados</h2><div class="body">
      <p id="chatst" class="empty"></p><div id="clog"></div>
    </div></div>
  </div>
  <div id="sheet" class="hidden"></div>
</div>
<div id="pk" class="pk hidden"><div class="pkb"><div class="pkh"><h3 id="pkt"></h3><div class="cr"><input id="pks" placeholder="Buscar…" autocomplete="off"><button class="btn" id="pkx">Fechar</button></div></div><div id="pkl"></div></div></div>
<div id="pw" class="pk hidden" style="align-items:center;padding:12px"><div class="pkb" style="max-height:none;border-radius:10px"><h3 id="pwt"></h3><div class="cr"><input id="pwi" type="password" placeholder="Senha" autocomplete="off" aria-label="Senha"><button class="btn" id="pwo">Entrar</button><button class="btn nb" id="pwx">Cancelar</button></div><p class="err" id="pwe"></p></div></div>
<div id="toast" role="status"></div>

function push(){
  const ids=[...PEND];PEND.clear();
  ids.forEach(async id=>{
    try{
      let v=JSON.stringify(DB[id]||{});
      if(id==="sx"){if(!SECK)throw 0;v=await enc(v)}
      const r=await fetch(`${BASE}/fichas/${KEYMAP[id]||id}.json`,{method:"PUT",body:JSON.stringify(v)});
      if(!r.ok)throw 0;if(!PEND.size)stat("Sincronizado com todos os aparelhos");
    }catch(e){PEND.add(id);stat("Sem conexão: salvo no aparelho, tentando de novo…");clearTimeout(persist.t);persist.t=setTimeout(push,5000)}
  });
}

function remote(id,s){
  if(id==="sx"){RAWSEC=s;if(SECK)applySec();return}
  if(PEND.has(id)||!CHARS.some(c=>c[0]===id))return;
  let o;try{o=JSON.parse(s)}catch(e){return}
  if(JSON.stringify(DB[id]||{})===JSON.stringify(o))return;
  DB[id]=o;try{localStorage.setItem(KEY,snap())}catch(e){}
  if(cur===id)refreshSheet();
}
function stream(path,apply,st){
  const es=new EventSource(`${BASE}/${path}.json`);
  const h=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}apply(e.type,m.path,m.data)};
  es.addEventListener("put",h);es.addEventListener("patch",h);
  es.onopen=()=>st(true);es.onerror=()=>st(false);
}
if(!BASE){E("chatst").textContent="Sincronização não configurada: fichas e rolagens ficam só neste aparelho."}

      const m=data||{};
      Object.keys(m).forEach(id=>m[id]!=null&&remote(REV[id]||id,m[id]));

    }else if(typeof data==="string")remote(REV[path.split("/")[1]]||path.split("/")[1],data);
  },ok=>{if(!ok)stat("Sem conexão: salvo no aparelho")});

const dsel=()=>Object.keys(DS).map(Number).filter(f=>DS[f]>0).sort((a,b)=>b-a);
function renderDice(){
  const sum=dsel().map(f=>DS[f]+"d"+f).join(" + ");
  E("dice").innerHTML=`<div class="dr">`+[...STD,...CUST].map(f=>`<div class="dd"><button class="dsel" data-f="${f}" aria-label="Adicionar d${f}">${dieSVG(f)}<span class="dn">d${f}</span>${DS[f]?`<span class="db">${DS[f]}</span>`:""}</button><button class="lk" data-m="${f}" aria-label="Remover d${f}">−</button></div>`).join("")+`</div>
  <div class="cr" style="margin-top:10px"><input id="cf" type="number" min="2" max="1000" placeholder="Dado personalizado: faces"><button class="btn nb" id="cadd">Criar dado</button></div>
  <p class="empty">${sum||"Toque nos dados para escolher quantos rolar."}</p>
  <div class="cr"><button class="btn" id="dgo">Jogar</button><button class="btn nb" id="dclr">Limpar</button></div>${DRES}`;
}
function diceClick(e){
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.f){DS[t.dataset.f]=Math.min((DS[t.dataset.f]||0)+1,99)}
  else if(t.dataset.m){DS[t.dataset.m]=Math.max((DS[t.dataset.m]||0)-1,0)}
  else if(t.id==="cadd"){
    const f=Math.floor(Number(E("cf").value));
    if(!(f>=2&&f<=1000)){toast("Use um dado de 2 a 1000 faces");return}
    if(!STD.includes(f)&&!CUST.includes(f))CUST.push(f);
    DS[f]=Math.max(DS[f]||0,1);
  }
  else if(t.id==="dclr"){DS={};DRES=""}
  else if(t.id==="dgo"){rollDice();return}
  else return;
  renderDice();
}
function rollDice(){
  const g=dsel(),n=g.reduce((s,f)=>s+DS[f],0);
  if(!n){toast("Escolha ao menos um dado");return}
  if(n>100){toast("Máximo de 100 dados por jogada");return}
  let total=0;const rolls=[];
  const det=g.map(f=>{const r=Array.from({length:DS[f]},()=>rnd(f));total+=r.reduce((a,b)=>a+b,0);rolls.push(...r);return `${DS[f]}d${f}: ${r.join(", ")}`}).join(" | ");
  const label=g.map(f=>DS[f]+"d"+f).join(" + ");
  DRES=`<div class="ri"><b>${label}</b><br>${esc(det)} = <b>${total}</b></div>`;
  renderDice();toast(`${label} = ${total}`);
  send({who:whoName(),label,det,rolls,total});
}

const hx=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
async function sha(s){return new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}
async function ks(key,len){const o=new Uint8Array(len);for(let i=0;i*32<len;i++){const b=await sha(key+":"+i);o.set(b.subarray(0,Math.min(32,len-i*32)),i*32)}return o}
async function enc(s,key=SECK){const b=new TextEncoder().encode("SX|"+s),k=await ks(key,b.length);let t="";b.forEach((x,i)=>t+=String.fromCharCode(x^k[i]));return btoa(t)}
async function dec(s,key=SECK){try{const t=atob(s),b=Uint8Array.from(t,c=>c.charCodeAt(0)),k=await ks(key,b.length),r=new TextDecoder().decode(b.map((x,i)=>x^k[i]));return r.startsWith("SX|")?r.slice(3):null}catch(e){return null}}
async function saveSec(){if(!SECK)return;try{localStorage.setItem("rpg-s",await enc(JSON.stringify(DB.sx||{})))}catch(e){}}
async function applySec(){
  const t=await dec(RAWSEC);if(t===null||PEND.has("sx"))return;
  let o;try{o=JSON.parse(t)}catch(e){return}
  if(JSON.stringify(DB.sx||{})===JSON.stringify(o))return;
  DB.sx=o;saveSec();if(cur==="sx")refreshSheet();
}
async function unlockSec(pw){
  const k=hx(await sha("sec1:"+pw)),t=await dec(SEC_BLOB,k);if(t===null)return false;
  const o=JSON.parse(t);SECK=k;SECP=o;IMG.sx=o.img;PAL.sx=o.pal;
  try{const l=localStorage.getItem("rpg-s");if(l){const x=await dec(l,k);if(x!==null)DB.sx=JSON.parse(x)}}catch(e){}
  if(RAWSEC)await applySec();else if(BASE&&DB.sx&&Object.keys(DB.sx).length){PEND.add("sx");push()}
  return true;
}
function gate(id){
  if(id!=="__new"&&(PH[id]==null||OKS.has(id))){open(id);return}
  GATE=id;E("pwt").textContent=id==="__new"?"Criar nova ficha":"Ficha de "+CHARS.find(c=>c[0]===id)[1];
  E("pwi").value="";E("pwe").textContent="";E("pw").classList.remove("hidden");E("pwi").focus();
}
async function pwGo(){
  const pw=E("pwi").value.trim().toLowerCase();if(!pw)return;
  let ok=false;
  try{ok=GATE==="__new"?await unlockSec(pw):hx(await sha("rpg1:"+GATE+":"+pw))===PH[GATE]}catch(e){ok=false}
  if(!ok){E("pwe").textContent="Senha incorreta";return}
  E("pw").classList.add("hidden");const id=GATE==="__new"?"sx":GATE;
  if(id!=="sx"){OKS.add(id);try{sessionStorage.setItem("rpg-ok",JSON.stringify([...OKS]))}catch(e){}}
  open(id);
}
